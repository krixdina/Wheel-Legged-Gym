# sim2real 部署共用配置。
# Python 版与 C++ 版推理代码共用本文件，保证两套实现的参数完全一致；
# 协议/固件一旦调整，只需改这里一处。

# ---- 串口 ----
# port 建议用 udev 规则绑定为固定名称，避免重新插拔后串口号变化。
serial:
  port: /dev/ttyUSB0
  baudrate: 115200

# ---- 帧协议（必须与下位机固件约定一致）----
# 帧结构：[SOF][payload][CRC8(可选)][EOF]。
# use_crc8=false 时帧内不含校验字节、收发都不做校验（payload 直接夹在 SOF/EOF 之间）。
frame:
  sof: 0xFF          # 帧头字节
  eof: 0x0D          # 帧尾字节
  use_crc8: true     # 校验总开关；false 则无校验字节、不校验
  crc8_poly: 0x07    # CRC-8 多项式（仅 use_crc8=true 时使用，固件须一致）
  crc8_init: 0x00    # CRC-8 初值
  # payload 二进制布局，使用小端序（struct 格式串），字段顺序由协议固定。
  # 上行（下位机 -> NUC）：除上一帧动作外网络需要的全部状态量，均为原始物理量、未缩放：
  #   base_ang_vel(3) | projected_gravity(3) | commands(3) |
  #   theta0(2) | theta0_dot(2) | L0(2) | L0_dot(2) | wheel_pos(2) | wheel_vel(2) = 21 floats
  # "<21f" 是 Python struct 格式串："<" 表示小端字节序，"21" 表示连续 21 个数值，"f" 表示每个数值按 4 字节 float 解析。
  uplink_format: "<21f"
  # 下行（NUC -> 下位机）：6 维策略动作 [L_theta, L_l0, L_wheel, R_theta, R_l0, R_wheel]
  downlink_format: "<6f"

# ---- 策略网络 ----
# 路径均相对仓库根目录。
network:
  # PyTorch 检查点：Python(torch) 版推理使用。
  model_path: sim2sim/model/model_8000.pt
  # ONNX 模型：C++(ONNX Runtime) 版推理使用。需先把 model_8000.pt 导出为 ONNX 再指向此处
  # （见 sim2real/python/export_onnx.py）。导出前该文件可能不存在；C++ policy 会明确检查并报错，
  # 而不是静默失败。Python 版忽略本字段。
  onnx_model_path: sim2real/model/policy.onnx
  num_obs: 27
  num_actions: 6
  obs_history_length: 5
  num_encoder_obs: 135       # 27 obs * 5 history
  latent_dim: 3              # encoder 估计的机体线速度等
  encoder_hidden_dims: [128, 64]
  actor_hidden_dims: [128, 64, 32]
  activation: elu

# ---- 观测缩放（下位机送原始量，缩放统一在 NUC 端做，与训练/sim2sim 一致）----
# 观测拼接顺序与缩放（projected_gravity 与 last_actions 不缩放，系数视为 1）：
observation_scales:
  ang_vel: 0.25
  dof_pos: 1.0
  dof_vel: 0.05
  l0: 4.5
  l0_dot: 0.25
  # commands [vx, wz, height] 的缩放 = [lin_vel, ang_vel, height_measurements]
  commands_scale: [2.0, 0.25, 5.0]

# ---- 动作缩放（策略原始动作 -> 带物理含义的动作量；NUC 端在下发前完成，下位机直接使用）----
# 动作 6 维顺序 [L_theta, L_l0, L_wheel, R_theta, R_l0, R_wheel]，缩放后每条腿含义：
#   theta0_ref [rad]      = action_theta * theta
#   l0_ref [m]            = action_l0    * l0 + l0_offset
#   wheel_vel_ref [rad/s] = action_wheel * vel
# 取值与 sim2sim 一致；改成在 NUC 缩放后，下位机收到的就是物理目标而非原始动作。
action_scales:
  theta: 0.6
  l0: 0.1
  vel: 6.0
  l0_offset: 0.2

# ---- 裁剪 ----
clipping:
  observations: 100.0
  actions: 100.0

# ---- 控制时序 ----
control_timing:
  policy_rate_hz: 100    # 策略/控制步频率
  # 连续丢失多少拍上行帧后判定链路丢失：deploy 主循环会停机并下发零动作。
  # 按 policy_rate_hz 折算时长，例如 100 Hz 下 10 拍≈0.1s；超过此值再重发陈旧动作不安全。
  max_missed_frames: 10
  # 打开串口失败（如设备未插）时，deploy 在进入控制循环前每隔多少秒重试一次，
  # 期间持续打印“无法找到串口”，直到串口可用或用户 Ctrl-C 退出。
  serial_reconnect_interval_s: 1.0
