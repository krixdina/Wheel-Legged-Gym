model:
  # Paths to the MuJoCo robot model and the trained policy checkpoint, relative
  # to the repo root (play_mujoco.py joins them with REPO_ROOT), matching how
  # recording.output_path is resolved. The robot MJCF lives under robot/ and the
  # policy checkpoint under model/ so the two asset kinds stay separated.
  xml_path: sim2sim/robot/wheel_legged_v4.xml
  policy_path: sim2sim/model/model_8000.pt

network:
  # Verified against the training-time config snapshot and model_8000.pt layer shapes.
  num_obs: 27
  num_actions: 6
  obs_history_length: 5
  # 27 obs * 5 history length
  num_encoder_obs: 135  
  # 3D body linear velocity
  latent_dim: 3
  encoder_hidden_dims: [128, 64]
  actor_hidden_dims: [128, 64, 32]
  activation: elu

clipping:
  observations: 100.0
  actions: 100.0

control_timing:
  sim_dt: 0.005
  decimation: 2

observation_scales:
  # Observation layout, matching LeggedRobotVMC.compute_proprioception_observations:
  #   [ 0: 3] base_ang_vel    * ang_vel
  #   [ 3: 6] projected_gravity
  #   [ 6: 9] commands[vx, wz, h] * commands_scale
  #   [ 9:11] theta0          * dof_pos
  #   [11:13] theta0_dot      * dof_vel
  #   [13:15] l0              * l0
  #   [15:17] l0_dot          * l0_dot
  #   [17:19] wheel dof_pos   * dof_pos
  #   [19:21] wheel dof_vel   * dof_vel
  #   [21:27] last actions
  lin_vel: 2.0
  ang_vel: 0.25
  dof_pos: 1.0
  dof_vel: 0.05
  l0: 4.5
  l0_dot: 0.25
  # The third command dimension is body height, normalized by height_measurements=5.0.
  height: 5.0
  # Order: [lin_vel, ang_vel, height_measurements].
  commands_scale: [2.0, 0.25, 5.0]

action_scales:
  theta: 0.6
  l0: 0.1
  vel: 6.0

control:
  l0_offset: 0.2
  feedforward_force: 80.0
  kp_theta: 80.0
  kd_theta: 4.0
  kp_l0: 900.0
  kd_l0: 45.0
  wheel_kd: 0.25

geometry:
  l1: 0.21
  l2: 0.25
  offset: 0.0

limits:
  # Order: [left_thigh, left_leg, left_wheel, right_thigh, right_leg, right_wheel].
  torque_limits: [30.0, 30.0, 4.5, 30.0, 30.0, 4.5]

initial_state:
  # Matches cfg.init_state.pos from the Isaac Gym training task. Can be modified
  base_pos: [0.0, 0.0, 0.0]
  # Order matches init_state.default_joint_angles and Isaac Gym DOF order:
  # [left_thigh, left_leg, left_wheel, right_thigh, right_leg, right_wheel].
  # 正常站立姿态
  # default_dof_pos: [-0.4, -0.6, 0.0, 0.4, 0.6, 0.0]
  # 双腿向后
  default_dof_pos: [0.8, 0.0, 0.0, -0.8, 0.0, 0.0]
  # 双腿向前
  # default_dof_pos: [3.1, 0.7, 0.0, -3.1, -0.7, 0.0]
  # 左腿向前，右腿向后
  # default_dof_pos: [3.1, 0.7, 0.0, -0.8, 0.0, 0.0]
  # 右腿向前，左腿向后
  # default_dof_pos: [0.8, 0.0, 0.0, -3.1, -0.7, 0.0]

dof_indices:
  left_thigh: 0
  left_leg: 1
  left_wheel: 2
  right_thigh: 3
  right_leg: 4
  right_wheel: 5
  wheel_idx: [2, 5]

default_command:
  height: 0.18

kinematics:
  # Finite-difference step for estimating virtual leg length and swing-angle rates from joint velocities.
  fk_diff_dt: 0.001

safety:
  # Fall-reset height threshold; play_mujoco.py resets the robot when base_link z drops below this value.
  fall_reset_height: 0.05

logging:
  # Status print interval in policy steps during headless runs; 100 is about once per second.
  status_interval_steps: 100

recording:
  # Offscreen video recording, enabled by `play_mujoco.py --record`.
  # MuJoCo renders frames offscreen (no window) and the system ffmpeg encodes an
  # H.264 mp4, so the clip is clean and can be produced on a headless server
  # (export MUJOCO_GL=egl there). The capture cadence is derived from `fps` so
  # the clip plays back at ~real time; see play_mujoco.py.
  output_path: sim2sim/recordings/play_3.mp4  # relative to repo root
  # Frame size in pixels; both must be even (yuv420p requirement).
  width: 1280
  height: 960
  fps: 50
  # Tracking camera that follows base_link so the robot stays framed while driving.
  camera:
    distance: 2.0     # [m] camera-to-robot distance
    azimuth: 90.0     # [deg] horizontal viewing angle (90 = side view)
    elevation: -15.0  # [deg] vertical angle; negative looks slightly downward
