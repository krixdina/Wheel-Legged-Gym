# Hyperparameter set for the FYT wheel-legged sim2sim verification.
#
# Every value here was cross-checked against the training-time config snapshot in
# logs/.../May12_13-34-06_num-envs-4096_dr-true/ and against the actual layer
# shapes of model_8000.pt, so the MuJoCo side reproduces the observation,
# action, and control pipeline the policy was trained with. Do not edit casually:
# changing any scale or gain here silently breaks sim2sim fidelity.
#
# Observation layout, matching LeggedRobotVMC.compute_proprioception_observations:
#   [ 0: 3] base_ang_vel    * ang_vel(0.25)
#   [ 3: 6] projected_gravity (unit gravity direction in base frame)
#   [ 6: 9] commands[vx, wz, h] * [lin_vel(2.0), ang_vel(0.25), height(5.0)]
#   [ 9:11] theta0 (virtual leg swing angle, L/R) * dof_pos(1.0)
#   [11:13] theta0_dot                           * dof_vel(0.05)
#   [13:15] l0 (virtual leg length, L/R)          * l0(4.5)
#   [15:17] l0_dot (L/R)                          * l0_dot(0.25)
#   [17:19] wheel dof_pos (L/R)                   * dof_pos(1.0)
#   [19:21] wheel dof_vel (L/R)                   * dof_vel(0.05)
#   [21:27] last actions (6)
#
# commands_scale = [lin_vel, ang_vel, height_measurements]
# torque_limits order:
#   [left_thigh, left_leg, left_wheel, right_thigh, right_leg, right_wheel]
# default_dof_pos order matches init_state.default_joint_angles and Isaac Gym
# DOF order:
#   [left_thigh, left_leg, left_wheel, right_thigh, right_leg, right_wheel]
# base_pos matches cfg.init_state.pos from the Isaac Gym training task.
# The third command dimension is body height, normalized by
# height_measurements=5.0, matching training.

network:
  num_obs: 27
  num_actions: 6
  obs_history_length: 5
  num_encoder_obs: 135
  latent_dim: 3
  encoder_hidden_dims: [128, 64]
  actor_hidden_dims: [128, 64, 32]
  activation: elu

clipping:
  observations: 100.0
  actions: 100.0

control_timing:
  sim_dt: 0.005
  decimation: 2

observation_scales:
  lin_vel: 2.0
  ang_vel: 0.25
  dof_pos: 1.0
  dof_vel: 0.05
  l0: 4.5
  l0_dot: 0.25
  height: 5.0
  commands_scale: [2.0, 0.25, 5.0]

action_scales:
  theta: 0.6
  l0: 0.1
  vel: 6.0

control:
  l0_offset: 0.2
  feedforward_force: 80.0
  kp_theta: 80.0
  kd_theta: 4.0
  kp_l0: 900.0
  kd_l0: 45.0
  wheel_kd: 0.25

geometry:
  l1: 0.21
  l2: 0.25
  offset: 0.0

limits:
  torque_limits: [30.0, 30.0, 4.5, 30.0, 30.0, 4.5]

initial_state:
  base_pos: [0.0, 0.0, 0.35]
  default_dof_pos: [-0.4, -0.6, 0.0, 0.4, 0.6, 0.0]

dof_indices:
  left_thigh: 0
  left_leg: 1
  left_wheel: 2
  right_thigh: 3
  right_leg: 4
  right_wheel: 5
  wheel_idx: [2, 5]

default_command:
  height: 0.18

kinematics:
  fk_diff_dt: 0.001

safety:
  fall_reset_height: 0.05

logging:
  status_interval_steps: 100
